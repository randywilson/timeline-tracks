# xcodegen project spec — generates TimelineTracks.xcodeproj.
# To regenerate after editing: cd ios && xcodegen generate
# Install xcodegen: brew install xcodegen

name: TimelineTracks
options:
  bundleIdPrefix: io.github.randywilson
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TimelineTracks:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimelineTracks
        excludes:
          - "Info.plist"   # referenced via INFOPLIST_FILE, not compiled
    settings:
      base:
        PRODUCT_NAME: TimelineTracks
        PRODUCT_BUNDLE_IDENTIFIER: io.github.randywilson.timelinetracks
        INFOPLIST_FILE: TimelineTracks/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # set this to your Apple Developer Team ID in Xcode

  TimelineTracksTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimelineTracksTests
    dependencies:
      - target: TimelineTracks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.randywilson.timelinetracksTests
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: iphonesimulator
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TimelineTracks.app/TimelineTracks"

schemes:
  TimelineTracks:
    build:
      targets:
        TimelineTracks: all
        TimelineTracksTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TimelineTracksTests
    archive:
      config: Release
